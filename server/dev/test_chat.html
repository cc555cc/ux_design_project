<!doctype html>
<!-- temporary page for testing the chatbot API, delete once the real client exists -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; gap: 16px; padding: 16px; height: 100vh; box-sizing: border-box; background: #f4f4f4; }
    #chat { flex: 2; display: flex; flex-direction: column; background: #fff; border: 1px solid #ccc; border-radius: 6px; }
    #log { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { margin: 6px 0; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; max-width: 80%; }
    .user { background: #d6e9ff; margin-left: auto; }
    .bot { background: #eee; }
    .error { background: #fdd; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ccc; }
    input { flex: 1; padding: 8px; font-size: 15px; }
    button { padding: 8px 14px; }
    #state { flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 12px; overflow: auto; }
    pre { font-size: 12px; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="log"></div>
    <form id="form">
      <input id="input" placeholder="Type a message…" autocomplete="off" autofocus>
      <button>Send</button>
      <button type="button" id="reset">Reset</button>
    </form>
  </div>
  <div id="state">
    <strong>Session state</strong>
    <pre id="stateView">—</pre>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    let sessionId = null;
    const log = document.getElementById("log");

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function call(path, body) {
      try {
        const res = await fetch(API + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) return addMessage(data.error, "error");
        sessionId = data.session_id;
        addMessage(data.reply, "bot");
        const { reply, ...state } = data;
        document.getElementById("stateView").textContent = JSON.stringify(state, null, 2);
      } catch (err) {
        addMessage("Cannot reach the server, is src/app.py running? (" + err.message + ")", "error");
      }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("input");
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      call("/api/chat", { message, session_id: sessionId });
    });

    document.getElementById("reset").addEventListener("click", () => {
      log.innerHTML = "";
      call("/api/chat/reset", { session_id: sessionId });
    });

    call("/api/chat/reset", {});
  </script>
</body>
</html>
